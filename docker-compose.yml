services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      PORT: 4000
      API_ONLY: 'true'
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: ${FRONTEND_BACKEND_IP:-172.29.46.10}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
      - egress

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/index.html >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      edge:
      backend:
        ipv4_address: ${FRONTEND_BACKEND_IP:-172.29.46.10}

  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    command: tunnel run
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
      - egress

networks:
  edge:
    internal: true
  egress:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.29.46.0/24}
